<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Reply</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        textarea {
            resize: vertical;
            min-height: 120px;
        }
    </style>
</head>
<body class="bg-gray-50 py-12">
    <div class="max-w-lg mx-auto bg-white shadow-xl rounded-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 text-white px-8 py-6">
            <h3 class="text-2xl font-semibold">Send Reply</h3>
            <p class="text-blue-100 mt-1 text-sm">Write your response below</p>
        </div>

        <!-- Form -->
        <form method="post" class="p-8 space-y-6" action="/myapp/send_reply_post/">
            {% csrf_token %}

            <div>
                <label for="reply"
                       class="block text-sm font-medium text-gray-700 mb-2">
                    Your Reply
                </label>
                <textarea
                    id="reply"
                    name="reply"
                    rows="6"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-y"
                    placeholder="Type your reply here..."></textarea>
            </div>

            <div class="flex justify-end">
                <button type="submit"
                        class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition-all duration-200 flex items-center gap-2 shadow-md hover:shadow-lg">
                    <span>Send Reply</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <script>
        // Optional: Tailwind script already included via CDN
    </script>
</body>
</html>
