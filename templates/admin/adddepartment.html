<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Department</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: none;
            border-radius: 15px;
        }
        .form-label {
            font-weight: 600;
            color: #2c3e50;
        }
        .btn-submit {
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 8px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }
        h2 {
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <div class="card p-4">
                <div class="card-body">
                    <h2 class="text-center mb-4">
                        ➕ Add New Department
                    </h2>

                    <form action="/myapp/add_department_post/" method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Department Name</label>
                            <input type="text"
                                   name="department"
                                   class="form-control"
                                   placeholder="Enter department name (e.g. Computer Science)"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Details</label>
                            <textarea name="details"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Enter department details..."></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-submit">
                                Add Department
                            </button>
                        </div>
                    </form>

                    <!-- Optional: Back Button -->
                    <div class="text-center mt-3">
                        <a href="/myapp/view_department" class="btn btn-outline-secondary">
                            ← Back to Home
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS (Optional - for better UX) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
