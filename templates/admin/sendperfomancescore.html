{% extends "home.html" %}
{% block body %}

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

body{
    background:#f1f5f9;
    font-family:'Poppins',sans-serif;
}

/* Main Container */
.score-container{
    width:100%;
    min-height:85vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

/* Card */
.score-card{
    width:100%;
    max-width:520px;
    background:white;
    padding:45px;
    border-radius:28px;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
    text-align:center;
}

/* Title */
.score-card h1{
    font-size:30px;
    font-weight:700;
    color:#0f172a;
    margin-bottom:10px;
}

.score-card p{
    color:#64748b;
    margin-bottom:35px;
    font-size:15px;
}

/* Star Rating */
.rating{
    display:flex;
    justify-content:center;
    flex-direction:row-reverse;
    gap:10px;
    margin-bottom:35px;
}

.rating input{
    display:none;
}

.rating label{
    font-size:48px;
    color:#d1d5db;
    cursor:pointer;
    transition:0.3s;
}

/* Hover Effect */
.rating label:hover,
.rating label:hover ~ label{
    color:#fbbf24;
    transform:scale(1.1);
}

/* Selected */
.rating input:checked ~ label{
    color:#fbbf24;
}

/* Button */
.submit-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(79,70,229,0.25);
}

/* Score Text */
.selected-text{
    font-size:15px;
    color:#475569;
    margin-top:-10px;
    margin-bottom:25px;
}

</style>

<div class="score-container">

    <div class="score-card">

        <h1>⭐ Rate Student Performance</h1>

        <p>
            Give a workshop performance rating for the student
        </p>

        <form method="post" action="/myapp/send_score_post/">

            {% csrf_token %}

            <!-- Star Rating -->
            <div class="rating">

                <input type="radio" name="score" value="5" id="star5">
                <label for="star5">★</label>

                <input type="radio" name="score" value="4" id="star4">
                <label for="star4">★</label>

                <input type="radio" name="score" value="3" id="star3">
                <label for="star3">★</label>

                <input type="radio" name="score" value="2" id="star2">
                <label for="star2">★</label>

                <input type="radio" name="score" value="1" id="star1" required>
                <label for="star1">★</label>

            </div>

            <div class="selected-text">
                Select rating from 1 to 5 stars
            </div>

            <button type="submit" class="submit-btn">
                Submit Rating
            </button>

        </form>

    </div>

</div>

{% endblock %}
