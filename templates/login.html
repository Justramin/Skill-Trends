<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In • Nebula</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: system-ui, -apple-system, sans-serif;
      color: #e0e0ff;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* Animated background blobs */
    .bg-blobs {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle at 30% 70%, #6e48aa44, #9d50bb22, transparent 60%);
      border-radius: 50%;
      filter: blur(80px);
      animation: float 25s infinite ease-in-out;
    }
    .blob:nth-child(2) {
      background: radial-gradient(circle at 70% 30%, #00d4ff44, #7cffc244, transparent 60%);
      animation-delay: -8s;
      width: 800px;
      height: 800px;
    }

    @keyframes float {
      0%,100% { transform: translate(-10%, -10%) scale(1); }
      50%     { transform: translate(10%, 10%) scale(1.15); }
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 2.8rem 2.4rem;
      border-radius: 1.4rem;
      background: rgba(20, 20, 45, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.6);
      z-index: 10;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.6rem;
      background: linear-gradient(90deg, #a78bfa, #7dd3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: #a0a0cc;
      margin-bottom: 2.2rem;
      font-size: 0.98rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.55rem;
      font-size: 0.9rem;
      color: #d0d0ff;
    }

    input {
      width: 100%;
      padding: 0.95rem 1.1rem;
      border: 1px solid rgba(160,160,220,0.2);
      border-radius: 0.75rem;
      background: rgba(40,40,70,0.4);
      color: white;
      font-size: 1rem;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(167,139,250,0.18);
      background: rgba(50,50,90,0.5);
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .btn-login {
      width: 100%;
      padding: 1rem;
      margin: 1.8rem 0 1.2rem;
      border: none;
      border-radius: 0.9rem;
      background: linear-gradient(90deg, #7c3aed, #3b82f6);
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -8px rgba(124,58,237,0.5);
    }

    .forgot {
      text-align: center;
      font-size: 0.9rem;
    }

    .forgot a {
      color: #a78bfa;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }

    .signup {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.95rem;
      color: #b0b0d0;
    }

    .signup a {
      color: #7dd3fc;
      font-weight: 500;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem; }
      h1 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob"></div>
    <div class="blob"></div>
  </div>

  <div class="login-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue to Nebula</p>

    <form action="/myapp/login_post/" method="post">
        {% csrf_token %}
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="name@example.com" name="name" required autocomplete="email"/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required name="password" autocomplete="current-password"/>
          <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
        </div>
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="forgot">
      <a href="#">Forgot password?</a>
    </div>

    <div class="signup">
      Don't have an account? <a href="/myapp/register/">Create one</a>
    </div>
  </div>

  <script>
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const type = password.type === 'password' ? 'text' : 'password';
      password.type = type;
      togglePassword.classList.toggle('fa-eye');
      togglePassword.classList.toggle('fa-eye-slash');
    });
  </script>

</body>
</html>
